# UAD 应用-验证-回滚（确定性，不调用 AI）。由 uad-fix 的 chain 作业通过 workflow_dispatch 触发。
# 只允许 lab/* 分支；main 只读校验。apply=true：把 AI 补丁推到 lab 分支 → 全量(C)测试 → 失败则强制回退到记录的修复前 SHA。
# apply=false：只在工作区应用补丁做回归测试，不推送（用于草稿 PR 回归）。同一问题最多 2 次尝试。
name: uad-verify
run-name: "uad-verify fix#${{ inputs.fix_run_id }} attempt ${{ inputs.attempt }} apply=${{ inputs.apply }}"
on:
  workflow_dispatch:
    inputs:
      fix_run_id: {description: "uad-fix run id", required: true}
      attempt: {description: "第几次尝试（1|2）", required: true, default: "1"}
      apply: {description: "true=推到 lab 分支并在失败时回滚", required: true, default: "true"}
      signature: {description: "失败签名", required: false, default: ""}
      track_issue: {description: "跟踪 issue", required: false, default: ""}
permissions: {contents: read}
concurrency: {group: "uad-verify-${{ github.ref }}", cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {contents: write, actions: write, issues: write, pull-requests: write}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BR: ${{ github.ref_name }}
      ATTEMPT: ${{ inputs.attempt }}
      APPLY: ${{ inputs.apply }}
      FIX_RUN: ${{ inputs.fix_run_id }}
      TRACK: ${{ inputs.track_issue }}
      SIG: ${{ inputs.signature }}
      UAD_OUT: .uad-out
    steps:
      - name: 分支与次数保护
        run: |
          case "$BR" in lab/*) ;; *) echo "::error::uad-verify 只允许 lab/* 分支（当前 $BR），拒绝"; exit 1;; esac
          case "$ATTEMPT" in 1|2) ;; *) echo "::error::尝试次数 $ATTEMPT 超出上限 2，停止"; exit 1;; esac
      - uses: actions/checkout@v5
        with: {ref: "${{ github.ref_name }}", fetch-depth: 0}
      - uses: actions/checkout@v5
        with: {repository: dehuamading/universal-ai-devops, ref: "${{ vars.UAD_FRAMEWORK_REF || 'main' }}", path: .uad-framework, persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - name: 记录修复前 SHA
        id: pre
        run: |
          mkdir -p .uad-out; git fetch -q origin main
          pre=$(git rev-parse HEAD); main_before=$(git rev-parse origin/main)
          { echo "branch=$BR"; echo "attempt=$ATTEMPT"; echo "fix_run=$FIX_RUN"; echo "pre_fix_sha=$pre"; echo "main_before=$main_before"; } | tee .uad-out/shas.txt
          echo "pre=$pre" >> $GITHUB_OUTPUT; echo "main_before=$main_before" >> $GITHUB_OUTPUT
      - name: 下载 AI 补丁 + 守卫
        id: patch
        run: |
          set +e
          gh run download "$FIX_RUN" -n agent -D .uad-out/agent
          shopt -s nullglob; P=(.uad-out/agent/*.patch)
          if [ ${#P[@]} -eq 0 ]; then echo "AI 没有产生补丁（已转为 issue/评论），无需验证"; echo has=false >> $GITHUB_OUTPUT; exit 0; fi
          cp "${P[0]}" .uad-out/ai.patch; echo has=true >> $GITHUB_OUTPUT
          python3 .uad-framework/tools/uad-guard.py .uad-out/ai.patch | tee .uad-out/guard.txt; echo "guard=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT
      - name: 应用补丁
        id: apply
        if: steps.patch.outputs.has == 'true' && steps.patch.outputs.guard == '0'
        run: |
          git config user.name "uad-verify[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git apply --index --exclude='.uad-evidence/*' --exclude='.uad-out/*' .uad-out/ai.patch
          git diff --cached --stat | tee .uad-out/applied-stat.txt
          if [ "$APPLY" = true ]; then
            git commit -qm "uad-verify: 应用 AI 补丁（fix run $FIX_RUN，尝试 $ATTEMPT）"
            git push origin "HEAD:$BR"
            echo "applied_sha=$(git rev-parse HEAD)" | tee -a .uad-out/shas.txt
            echo "applied=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          fi
      - name: 全量回归测试（C 级）
        id: test
        if: steps.apply.outcome == 'success'
        run: |
          set +e
          bash .uad-framework/adapters/python/run.sh C > .uad-out/verify.log 2>&1; t=$?
          cat .uad-out/verify.log; echo "t=$t" >> $GITHUB_OUTPUT
          sig=$(bash .uad-framework/tools/uad-signature.sh .uad-out); echo "verify_signature=$sig" | tee -a .uad-out/shas.txt
      - name: 失败 → 回滚 lab 分支到修复前 SHA
        id: rb
        if: always() && steps.apply.outputs.applied != '' && steps.test.outputs.t != '0'
        run: |
          pre=${{ steps.pre.outputs.pre }}; applied=${{ steps.apply.outputs.applied }}
          git push --force-with-lease="$BR:$applied" origin "$pre:refs/heads/$BR"
          now=$(gh api "repos/$GH_REPO/commits/$BR" -q .sha)
          echo "after_rollback_sha=$now" | tee -a .uad-out/shas.txt
          [ "$now" = "$pre" ] || { echo "::error::回滚校验失败：$now ≠ $pre"; exit 1; }
          echo "✅ 已回退 $BR：$applied → $pre" | tee -a .uad-out/shas.txt
      - name: main 未被改动校验
        if: always()
        run: |
          now=$(gh api repos/$GH_REPO/commits/main -q .sha); echo "main_after=$now" | tee -a .uad-out/shas.txt
          [ "$now" = "${{ steps.pre.outputs.main_before }}" ] || { echo "::error::main 被改动！"; exit 1; }
      - name: 保存完整日志
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: "uad-verify-attempt-${{ inputs.attempt }}", path: .uad-out/, include-hidden-files: true, if-no-files-found: warn}
      - name: 为下一次尝试准备证据
        if: always() && steps.test.outputs.t != '' && steps.test.outputs.t != '0'
        run: |
          mkdir -p ev; cp .uad-out/verify.log ev/console.log
          python3 - <<'PY'
          import json,os
          fail=open('.uad-out/failing.txt').read().split('\n') if os.path.exists('.uad-out/failing.txt') else []
          json.dump({"kind":"test","source":"uad-verify","attempt":int(os.environ['ATTEMPT']),"failing":[f for f in fail if f],
                     "note":"上一次 AI 补丁通过了 A 级测试但未通过 C 级全量回归，已回滚。请用 python -m pytest -q（全量）验证。"},
                    open('ev/failure-summary.json','w'),ensure_ascii=False,indent=1)
          PY
      - if: always() && steps.test.outputs.t != '' && steps.test.outputs.t != '0'
        uses: actions/upload-artifact@v4
        with: {name: uad-evidence, path: ev/}
      - name: 下一步（≤2 次，之后停止）
        if: always() && steps.patch.outputs.has == 'true'
        env: {DSK: "${{ secrets.DEEPSEEK_API_KEY }}", BAL_START: "${{ vars.UAD_BALANCE_START }}", STOP: "${{ vars.UAD_BUDGET_STOP_CNY || '5' }}", MAXD: "${{ vars.UAD_MAX_AI_RUNS_PER_DAY || '3' }}"}
        run: |
          t="${{ steps.test.outputs.t }}"; g="${{ steps.patch.outputs.guard }}"
          if [ "$g" = 0 ] && [ "$t" = 0 ]; then msg="✅ 尝试 $ATTEMPT：全量回归通过"; [ -n "$TRACK" ] && gh issue comment "$TRACK" -b "$msg（verify run ${{ github.run_id }}）"; echo "$msg" >> $GITHUB_STEP_SUMMARY; exit 0; fi
          msg="❌ 尝试 $ATTEMPT 失败（守卫=$g，测试=$t），lab 分支已回退到 ${{ steps.pre.outputs.pre }}"
          next=no
          if [ "$ATTEMPT" -lt 2 ] && [ "$APPLY" = true ]; then
            ok=yes
            [ "${{ vars.UAD_AI_ENABLED }}" = true ] || { ok=no; msg="$msg；AI 开关已关，停止"; }
            cur=$(curl -sf -m 20 -H "Authorization: Bearer $DSK" https://api.deepseek.com/user/balance | python3 -c "import json,sys;d=json.load(sys.stdin);print(sum(float(b['total_balance']) for b in d['balance_infos'] if b['currency']=='CNY'))") || { ok=no; msg="$msg；余额查询失败，停止"; }
            [ $ok = yes ] && python3 -c "import sys;sys.exit(0 if $BAL_START-$cur < $STOP else 1)" || { [ $ok = yes ] && msg="$msg；达到预算停止线，停止"; ok=no; }
            n=$(gh run list -w uad-fix.lock.yml -L 50 --json createdAt -q "[.[]|select(.createdAt|startswith(\"$(date -u +%F)\"))]|length")
            [ $ok = yes ] && [ "$n" -ge "$MAXD" ] && { ok=no; msg="$msg；达到每日上限，停止"; }
            [ $ok = yes ] && next=yes
          else msg="$msg；已达同一问题 2 次上限，停止，需人工介入"; fi
          if [ $next = yes ]; then
            gh workflow run uad-fix.lock.yml --ref "$BR" -f mode=fix -f source_run_id=${{ github.run_id }} -f signature="$SIG" -f track_issue="$TRACK" -f attempt=2
            msg="$msg；已触发第 2 次尝试"
          else
            [ -n "$TRACK" ] && gh issue edit "$TRACK" --add-label uad-failed || true
          fi
          [ -n "$TRACK" ] && gh issue comment "$TRACK" -b "$msg。日志工件：uad-verify-attempt-$ATTEMPT（run ${{ github.server_url }}/$GH_REPO/actions/runs/${{ github.run_id }}）"
          echo "$msg" | tee -a $GITHUB_STEP_SUMMARY
      - name: 结论
        if: always()
        run: '[ "${{ steps.patch.outputs.has }}" != true ] || { [ "${{ steps.patch.outputs.guard }}" = 0 ] && [ "${{ steps.test.outputs.t }}" = 0 ]; }'
