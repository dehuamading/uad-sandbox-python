# 实验分支 CI（lab/*）：使用框架分支 docs/phase3-hardening（修复签名提取），其余同模板
name: ci
on:
  push:
    branches: [main, "exp/**", "lab/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      request_issue: {description: "B 级需求 issue 编号（走 request 门禁）", type: string, default: ""}
permissions:
  contents: read
jobs:
  test:
    uses: dehuamading/universal-ai-devops/.github/workflows/uad-test.yml@docs/phase3-hardening
    with: {stack: python, tier: A, framework-ref: docs/phase3-hardening}
  gate:
    needs: test
    if: always() && github.event_name == 'push' && needs.test.outputs.kind != 'pass' && needs.test.outputs.kind != ''
    permissions: {contents: read, actions: write, issues: write}
    uses: dehuamading/universal-ai-devops/.github/workflows/uad-gate.yml@docs/phase3-hardening
    with:
      kind: ${{ needs.test.outputs.kind }}
      signature: ${{ needs.test.outputs.signature }}
      source_run_id: ${{ github.run_id }}
      ref: ${{ github.ref_name }}
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  request:
    if: github.event_name == 'workflow_dispatch' && inputs.request_issue != ''
    permissions: {contents: read, actions: write, issues: write}
    uses: dehuamading/universal-ai-devops/.github/workflows/uad-gate.yml@docs/phase3-hardening
    with:
      kind: request
      signature: request
      source_run_id: ${{ github.run_id }}
      issue_number: ${{ inputs.request_issue }}
      ref: ${{ github.ref_name }}
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  detection-assert:   # 回归断言：编译后的 lock 必须包含写判定文件的确定性检测步骤
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: actions/checkout@v5
        with: {repository: dehuamading/universal-ai-devops, ref: "${{ vars.UAD_FRAMEWORK_REF || 'main' }}", path: .uad-framework, persist-credentials: false}
      - run: UAD_LOCKS="$PWD/.github/workflows/uad-fix.lock.yml" bash .uad-framework/tests/test-detect.sh
