# 用户提交需求 issue 并加标签 uad-request → 闸门 → AI 只做分级与方案（B 级不写代码）
name: uad-intake
on:
  issues:
    types: [labeled]
permissions:
  contents: read
jobs:
  gate:
    if: github.event.label.name == 'uad-request' && github.event.sender.login == github.repository_owner
    permissions: {contents: read, actions: write, issues: write}
    uses: dehuamading/universal-ai-devops/.github/workflows/uad-gate.yml@main
    with:
      kind: request
      issue_number: ${{ format('{0}', github.event.issue.number) }}
      ref: ${{ github.event.repository.default_branch }}
    secrets:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
